<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wuthering Waves Guide & Encyclopedia (60 Resonators) - Standalone React 18</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700;800&family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- React 18 & Babel Standalone (No Node.js Required) -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg-dark: #050811;
      --bg-main: #080c17;
      --bg-surface: #0c1324;
      --bg-card: rgba(12, 19, 36, 0.94);
      --cyan-wave: #00f0ff;
      --cyan-deep: #0891b2;
      --gold-solaris: #f59e0b;
      --gold-bright: #fbbf24;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-highlight: rgba(0, 240, 255, 0.3);
      --font-main: 'Prompt', sans-serif;
      --font-tech: 'Chakra Petch', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; color-scheme: dark; }
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-main);
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .container { max-width: 1240px; margin: 0 auto; padding: 0 1.5rem; }

    /* Navbar */
    .navbar {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 1000;
      padding: 1rem 0; transition: all 0.3s ease;
      background: rgba(5, 8, 17, 0.75); border-bottom: 1px solid transparent;
    }
    .navbar.scrolled {
      background: rgba(8, 12, 23, 0.95);
      border-bottom: 1px solid var(--border-color);
      padding: 0.75rem 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; }
    .nav-logo { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; color: var(--text-main); }
    .logo-emblem {
      width: 36px; height: 36px; border-radius: 8px;
      background: linear-gradient(135deg, var(--cyan-wave), var(--cyan-deep));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem; color: #000; font-weight: 800;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
    }
    .logo-title { font-family: var(--font-tech); font-weight: 800; letter-spacing: 1.5px; font-size: 1.1rem; line-height: 1.1; }
    .logo-sub { font-size: 0.65rem; color: var(--cyan-wave); letter-spacing: 2px; font-family: var(--font-tech); }
    .nav-links { display: flex; list-style: none; gap: 1.5rem; align-items: center; }
    .nav-link { text-decoration: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; transition: color 0.2s, transform 0.2s; cursor: pointer; }
    .nav-link:hover { color: var(--cyan-wave); transform: translateY(-1px); }
    .nav-right { display: flex; align-items: center; gap: 0.75rem; }

    .sound-toggle-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color);
      color: var(--text-muted); width: 38px; height: 38px; border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.1rem; transition: all 0.2s;
    }
    .sound-toggle-btn:hover { border-color: var(--cyan-wave); color: var(--cyan-wave); transform: scale(1.05); }

    .menu-toggle {
      display: none; background: none; border: 1px solid var(--border-color);
      color: var(--text-main); font-size: 1.4rem; padding: 0.3rem 0.6rem; border-radius: 6px; cursor: pointer;
    }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
      font-family: var(--font-tech); font-weight: 700; font-size: 0.9rem;
      padding: 0.75rem 1.5rem; border-radius: 8px; text-decoration: none;
      cursor: pointer; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      border: none; outline: none;
    }
    .btn-gold {
      background: linear-gradient(135deg, var(--gold-bright), var(--gold-solaris));
      color: #050811; box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }
    .btn-gold:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5); }
    .btn-outline {
      background: rgba(255, 255, 255, 0.04); color: var(--text-main); border: 1px solid var(--border-color);
    }
    .btn-outline:hover {
      border-color: var(--cyan-wave); color: var(--cyan-wave); background: rgba(0, 240, 255, 0.08); transform: translateY(-2px);
    }

    /* Hero */
    .hero {
      position: relative; min-height: 90vh; display: flex; align-items: center;
      padding-top: 6rem; padding-bottom: 4rem; overflow: hidden;
    }
    .hero-glow-sphere {
      position: absolute; top: 20%; left: 50%; transform: translate(-50%, -20%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(0, 240, 255, 0.12) 0%, rgba(245, 158, 11, 0.05) 50%, transparent 70%);
      filter: blur(60px); pointer-events: none; z-index: 1;
    }
    .hero-content { position: relative; z-index: 2; text-align: center; max-width: 900px; }
    .hero-tag {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.25);
      color: var(--cyan-wave); padding: 0.35rem 1rem; border-radius: 9999px;
      font-family: var(--font-tech); font-size: 0.8rem; margin-bottom: 1.5rem;
    }
    .hero-tag-pulse {
      width: 8px; height: 8px; background: var(--cyan-wave); border-radius: 50%;
      box-shadow: 0 0 10px var(--cyan-wave); animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .hero-title {
      font-size: clamp(2.2rem, 5vw, 4rem); font-weight: 800; line-height: 1.2; margin-bottom: 1.25rem; letter-spacing: -0.5px;
    }
    .gold-text { color: var(--gold-bright); text-shadow: 0 0 25px rgba(251, 191, 36, 0.35); }
    .cyan-gradient-text {
      background: linear-gradient(135deg, var(--cyan-wave), #38bdf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hero-desc {
      font-size: 1.05rem; color: var(--text-muted); line-height: 1.7; max-width: 720px; margin: 0 auto 2rem;
    }
    .hero-actions { display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 3.5rem; }
    .hero-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.25rem; margin-top: 1rem; }
    .stat-card {
      background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem 1rem;
      border-radius: 12px; text-align: center; transition: transform 0.2s, border-color 0.2s; contain: content;
    }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--border-highlight); }
    .stat-num { font-family: var(--font-tech); font-size: 1.8rem; font-weight: 800; color: var(--cyan-wave); margin-bottom: 0.25rem; }
    .stat-label { font-size: 0.8rem; color: var(--text-dim); }

    /* Sections */
    .section-title-wrap { text-align: center; margin-bottom: 3rem; }
    .section-subtitle { font-family: var(--font-tech); color: var(--cyan-wave); font-size: 0.85rem; letter-spacing: 2px; margin-bottom: 0.5rem; }
    .section-h2 { font-size: clamp(1.8rem, 3.5vw, 2.5rem); font-weight: 800; }

    .about-section { padding: 6rem 0; background: var(--bg-main); border-top: 1px solid var(--border-color); }
    .about-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; }
    .about-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      padding: 2rem 1.5rem; transition: transform 0.2s, border-color 0.2s; contain: content;
    }
    .about-card:hover { transform: translateY(-4px); border-color: var(--cyan-wave); }
    .about-icon { font-size: 2.2rem; margin-bottom: 1rem; }
    .about-card-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text-main); }
    .about-card-desc { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }

    /* Featured Showcase */
    .resonators-section { padding: 6rem 0; background: var(--bg-dark); }
    .char-tabs-bar { display: flex; gap: 0.75rem; overflow-x: auto; padding-bottom: 1rem; margin-bottom: 2rem; scrollbar-width: thin; }
    .char-tab-item {
      display: flex; align-items: center; gap: 0.65rem; background: var(--bg-card);
      border: 1px solid var(--border-color); border-radius: 12px; padding: 0.6rem 1rem;
      cursor: pointer; white-space: nowrap; transition: all 0.2s;
    }
    .char-tab-item:hover, .char-tab-item.active {
      border-color: var(--gold-bright); background: rgba(245, 158, 11, 0.12); transform: translateY(-2px);
    }
    .char-tab-thumb { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    .char-tab-label { font-family: var(--font-tech); font-weight: 700; font-size: 0.9rem; color: var(--text-main); }

    .resonator-showcase {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px;
      padding: 2.5rem; display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 3rem; align-items: center; contain: content;
    }
    .showcase-element-tag {
      font-family: var(--font-tech); font-weight: 700; font-size: 0.75rem; padding: 0.2rem 0.6rem;
      border-radius: 4px; background: rgba(0, 240, 255, 0.15); color: var(--cyan-wave); border: 1px solid rgba(0, 240, 255, 0.3);
    }
    .showcase-title { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.25rem; }
    .showcase-sub { color: var(--gold-bright); font-size: 1rem; margin-bottom: 1rem; font-weight: 500; }
    .showcase-desc { color: var(--text-muted); font-size: 0.95rem; line-height: 1.65; margin-bottom: 1.25rem; }
    .showcase-visual { text-align: center; }
    .showcase-avatar-wrapper {
      position: relative; width: 280px; height: 280px; margin: 0 auto 1.5rem; border-radius: 20px;
      overflow: hidden; border: 2px solid var(--border-highlight);
      background: radial-gradient(circle, rgba(0, 240, 255, 0.2) 0%, transparent 70%);
    }
    .showcase-portrait-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .showcase-portrait-img:hover { transform: scale(1.05); }
    .showcase-weapon-tag { font-family: var(--font-tech); font-size: 0.85rem; color: var(--text-dim); }

    /* Roster Encyclopedia */
    .filter-controls-wrap {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      padding: 1.5rem; margin-bottom: 2rem; display: flex; flex-direction: column; gap: 1.25rem;
    }
    .filter-group { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .filter-label { font-family: var(--font-tech); font-size: 0.85rem; color: var(--text-dim); margin-right: 0.5rem; }
    .filter-btn {
      background: rgba(255, 255, 255, 0.04); border: 1px solid var(--border-color);
      color: var(--text-muted); padding: 0.45rem 0.9rem; border-radius: 8px; font-size: 0.85rem;
      font-family: var(--font-tech); cursor: pointer; transition: all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active {
      background: rgba(0, 240, 255, 0.15); border-color: var(--cyan-wave); color: var(--cyan-wave);
    }
    .filter-search-wrap { display: flex; align-items: center; gap: 0.5rem; }
    .filter-search-input {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 0.5rem 1rem; border-radius: 8px; font-family: var(--font-main); font-size: 0.85rem;
      width: 260px; outline: none; transition: border-color 0.2s;
    }
    .filter-search-input:focus { border-color: var(--cyan-wave); }

    .all-roster-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 1.25rem;
    }
    .roster-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px;
      padding: 1.15rem 0.85rem; text-align: center; transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; cursor: pointer; contain: content;
    }
    .roster-card:hover {
      transform: translateY(-5px); border-color: var(--card-element-color, var(--cyan-wave));
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 0 0 15px var(--card-glow, rgba(6, 182, 212, 0.3));
    }
    .roster-card.five-star { border-top: 3px solid var(--gold-solaris); }
    .roster-card.four-star { border-top: 3px solid #c084fc; }

    .roster-card-version {
      position: absolute; top: 8px; right: 8px; font-family: var(--font-tech); font-size: 0.65rem;
      font-weight: 700; padding: 1px 7px; border-radius: 6px; background: rgba(255, 255, 255, 0.08);
      color: var(--text-dim); border: 1px solid rgba(255, 255, 255, 0.1); letter-spacing: 0.5px;
    }
    .roster-card-version.tba { background: rgba(245, 158, 11, 0.15); color: var(--gold-bright); border-color: rgba(245, 158, 11, 0.35); }

    .roster-card-avatar {
      width: 80px; height: 80px; border-radius: 50%; border: 2px solid var(--card-element-color, var(--border-color));
      padding: 3px; background: var(--bg-surface); margin-bottom: 0.75rem; overflow: hidden;
    }
    .roster-card-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; transition: transform 0.3s; }
    .roster-card:hover .roster-card-avatar img { transform: scale(1.1); }
    .roster-card-name { font-size: 1rem; font-weight: 700; margin-bottom: 0.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    .roster-card-sub { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; }
    .roster-card-badge { font-family: var(--font-tech); font-size: 0.7rem; padding: 0.15rem 0.55rem; border-radius: 9999px; font-weight: 600; margin-top: auto; }

    /* Meta Teams */
    .team-filter-tabs { display: flex; justify-content: center; gap: 0.75rem; flex-wrap: wrap; margin-bottom: 2.5rem; }
    .team-tab-btn {
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
      font-family: var(--font-tech); font-weight: 700; font-size: 0.9rem; padding: 0.65rem 1.25rem;
      border-radius: 10px; cursor: pointer; transition: all 0.2s;
    }
    .team-tab-btn:hover, .team-tab-btn.active {
      border-color: var(--cyan-wave); background: rgba(0, 240, 255, 0.12); color: var(--cyan-wave); transform: translateY(-2px);
    }
    .meta-teams-list { display: flex; flex-direction: column; gap: 2rem; }
    .meta-team-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 20px;
      padding: 2rem; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; contain: content;
    }
    .meta-team-card:hover { transform: translateY(-3px); border-color: var(--border-highlight); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4); }
    .meta-team-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; }
    .meta-team-rank-badge {
      width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
      font-family: var(--font-tech); font-size: 1.25rem; font-weight: 800;
    }
    .meta-team-rank-badge.rank-1 { background: linear-gradient(135deg, #fbbf24, #d97706); color: #000; box-shadow: 0 0 15px rgba(245, 158, 11, 0.5); }
    .meta-team-rank-badge.rank-2 { background: linear-gradient(135deg, #e2e8f0, #94a3b8); color: #000; box-shadow: 0 0 15px rgba(226, 232, 240, 0.4); }
    .meta-team-rank-badge.rank-3 { background: linear-gradient(135deg, #f97316, #b45309); color: #fff; box-shadow: 0 0 15px rgba(249, 115, 22, 0.4); }
    .meta-team-rank-badge.rank-other { background: rgba(255, 255, 255, 0.08); color: var(--cyan-wave); border: 1px solid var(--border-highlight); }
    .meta-team-title { font-size: 1.3rem; font-weight: 800; }
    .meta-team-sub { font-size: 0.85rem; color: var(--text-dim); }
    .meta-team-tier-badge {
      font-family: var(--font-tech); font-weight: 800; font-size: 0.85rem; padding: 0.35rem 0.85rem; border-radius: 9999px; letter-spacing: 1px;
    }
    .tier-ex { background: rgba(245, 158, 11, 0.2); color: var(--gold-bright); border: 1px solid var(--gold-solaris); }
    .tier-s-plus { background: rgba(192, 132, 252, 0.2); color: #c084fc; border: 1px solid #a855f7; }
    .tier-s { background: rgba(0, 240, 255, 0.15); color: var(--cyan-wave); border: 1px solid var(--cyan-deep); }
    .meta-team-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.75rem; }
    .meta-tag { font-family: var(--font-tech); font-size: 0.75rem; padding: 0.2rem 0.6rem; border-radius: 6px; background: rgba(255, 255, 255, 0.05); color: var(--text-muted); border: 1px solid var(--border-color); }
    .meta-team-members-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; margin: 1.5rem 0; }
    .meta-member-item { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 1rem; text-align: center; transition: transform 0.2s; }
    .meta-member-item:hover { transform: translateY(-2px); border-color: var(--cyan-wave); }
    .meta-member-avatar { position: relative; width: 70px; height: 70px; margin: 0 auto 0.75rem; }
    .meta-member-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--cyan-wave); }
    .meta-member-role {
      position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); background: var(--bg-dark);
      border: 1px solid var(--border-highlight); font-family: var(--font-tech); font-size: 0.65rem; color: var(--cyan-wave);
      padding: 1px 6px; border-radius: 9999px; white-space: nowrap;
    }
    .meta-member-name { font-weight: 700; font-size: 0.95rem; margin-bottom: 0.2rem; }
    .meta-member-elem { font-size: 0.75rem; color: var(--text-dim); font-family: var(--font-tech); }
    .meta-synergy-box { background: rgba(0, 240, 255, 0.03); border: 1px solid rgba(0, 240, 255, 0.15); border-radius: 12px; padding: 1.25rem; margin-bottom: 1.25rem; }
    .meta-synergy-title { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.9rem; color: var(--cyan-wave); margin-bottom: 0.5rem; }
    .meta-synergy-text { font-size: 0.9rem; color: var(--text-muted); line-height: 1.6; }
    .meta-rotation-box { background: rgba(245, 158, 11, 0.03); border: 1px solid rgba(245, 158, 11, 0.15); border-radius: 12px; padding: 1.25rem; }
    .meta-rotation-title { display: flex; align-items: center; gap: 0.5rem; font-weight: 700; font-size: 0.9rem; color: var(--gold-bright); margin-bottom: 0.75rem; }
    .meta-rotation-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
    .rotation-step-card { background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.85rem; }
    .step-num-badge { font-family: var(--font-tech); font-size: 0.7rem; color: var(--gold-bright); font-weight: 800; margin-bottom: 0.25rem; }
    .step-char-name { font-weight: 700; font-size: 0.85rem; color: var(--text-main); margin-bottom: 0.35rem; }
    .step-desc-text { font-size: 0.8rem; color: var(--text-dim); line-height: 1.45; }

    /* Features */
    .features-section { padding: 6rem 0; background: var(--bg-dark); }
    .features-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1.5rem; }
    .feature-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      padding: 1.75rem 1.25rem; transition: transform 0.2s, border-color 0.2s; contain: content;
    }
    .feature-card:hover { transform: translateY(-4px); border-color: var(--cyan-wave); }
    .feature-icon { font-size: 2rem; margin-bottom: 1rem; }
    .feature-card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.5rem; }
    .feature-card-desc { font-size: 0.85rem; color: var(--text-muted); line-height: 1.55; }

    /* Redeem */
    .redeem-section { padding: 6rem 0; background: var(--bg-main); }
    .redeem-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .redeem-card {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
      padding: 1.5rem; transition: transform 0.2s, border-color 0.2s; contain: content;
    }
    .redeem-card:hover { transform: translateY(-3px); border-color: var(--gold-bright); }
    .redeem-status-tag {
      font-family: var(--font-tech); font-size: 0.7rem; color: #34d399; background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.3); padding: 2px 8px; border-radius: 9999px; font-weight: 700;
    }

    function App() {
      const [soundEnabled, setSoundEnabled] = useState(true);
      const [perfMode, setPerfMode] = useState(false);
      const [toast, setToast] = useState(null);
      const audioCtxRef = useRef(null);

      const getAudioContext = useCallback(() => {
        if (!audioCtxRef.current) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) audioCtxRef.current = new AudioCtx();
        }
        if (audioCtxRef.current && audioCtxRef.current.state === 'suspended') {
          audioCtxRef.current.resume();
        }
        return audioCtxRef.current;
      }, []);

      const playTone = useCallback((freq = 520, type = 'sine', duration = 0.12) => {
        if (!soundEnabled) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, ctx.currentTime);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + duration);
        } catch(e) {}
      }, [soundEnabled, getAudioContext]);

      const playChime = useCallback(() => {
        if (!soundEnabled) return;
        try {
          const ctx = getAudioContext();
          if (!ctx) return;
          const now = ctx.currentTime;
          [587.33, 880, 1174.66].forEach((freq, idx) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.06, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.18);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.18);
          });
        } catch(e) {}
      }, [soundEnabled, getAudioContext]);

      const showToast = useCallback((msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3200);
      }, []);

      // Canvas Particle
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        if (!ctx) return;
        let animId;
        let w = (canvas.width = window.innerWidth);
        let h = (canvas.height = window.innerHeight);
        const onResize = () => { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; };
        window.addEventListener('resize', onResize);

        const count = perfMode ? 15 : 45;
        const particles = [];
        const colors = ['#00f0ff', '#ffd700', '#c084fc', '#ffffff'];
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w, y: Math.random() * h,
            r: Math.random() * 2 + 1, color: colors[Math.floor(Math.random() * colors.length)],
            vx: (Math.random() - 0.5) * 0.4, vy: (Math.random() - 0.5) * 0.4,
            alpha: Math.random() * 0.5 + 0.2
          });
        }

        const loop = () => {
          ctx.clearRect(0, 0, w, h);
          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.x += p.vx; p.y += p.vy;
            if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;

            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha * 0.35;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.2, 0, Math.PI * 2); ctx.fill();

            ctx.globalAlpha = p.alpha;
            ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
          }
          animId = requestAnimationFrame(loop);
        };
        loop();
        return () => { window.removeEventListener('resize', onResize); cancelAnimationFrame(animId); };
      }, [perfMode]);

      // Roster filtering
      const [elemFilter, setElemFilter] = useState('all');
      const [rarityFilter, setRarityFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');

      const filteredResonators = useMemo(() => {
        return allResonators.filter(char => {
          const matchElem = elemFilter === 'all' || char.element === elemFilter;
          const matchRarity = rarityFilter === 'all' || String(char.rarity) === rarityFilter;
          const q = searchQuery.trim().toLowerCase();
          const matchSearch = !q || char.name.toLowerCase().includes(q) || char.nameTh.toLowerCase().includes(q) || char.weapon.toLowerCase().includes(q) || (char.version && char.version.toLowerCase().includes(q));
          return matchElem && matchRarity && matchSearch;
        });

              <div className="hero-stats">

                  <h3 className="feature-card-title">Parry & Counter</h3>
